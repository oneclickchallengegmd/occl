<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Submit record — OCCL</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html">OCCL</a><nav><a href="index.html">Challenges</a><a href="records.html">Records</a><a href="submit-record.html">Submit record</a><a href="submit-level.html">Suggest level</a><a href="editors.html">Creator panel</a></nav></header><main class="wrap"><h1>Submit a record</h1><p class="muted">Submissions remain pending until SpikeGmd reviews them.</p><form id="form" class="fields"><div class="field"><label>Player name</label><input id="player" required maxlength="60"></div><div class="field"><label>Challenge</label><select id="level" required><option value="">Choose one</option><option>Wowzers</option><option>Giga Chad</option><option>Framy</option><option>Free OCCL Points</option><option>Huh</option></select></div><div class="field"><label>Progress (%)</label><input id="progress" type="number" min="1" max="100" required></div><div class="field"><label>Attempts (optional)</label><input id="attempts" type="number" min="0"></div><div class="field full"><label>Proof video URL</label><input id="video" type="url" required></div><div class="field full"><label>Notes (optional)</label><textarea id="notes"></textarea></div><div class="field full"><button class="btn">Submit record</button><p id="msg" class="muted small"></p></div></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase.js"></script><script>let q=new URLSearchParams(location.search).get("level");if(q)document.querySelector("#level").value=q;document.querySelector("#form").onsubmit=async e=>{e.preventDefault();let m=document.querySelector("#msg");try{if(!occlClient)throw Error("Configure supabase-config.js first.");let {error}=await occlClient.from("record_submissions").insert({player_name:player.value.trim(),level_name:level.value,progress:Number(progress.value),attempts:attempts.value?Number(attempts.value):null,video_url:video.value.trim(),notes:notes.value.trim(),status:"pending"});if(error)throw error;e.target.reset();m.textContent="Submitted for review!";}catch(x){m.textContent="Submission failed: "+x.message;}}</script></body></html>
