<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OCCL — Submit Record</title><style>
:root{--g:#2e9f80;--bg:#fff;--text:#151515;--muted:#686868;--line:#e4e7e6;--soft:#f3f7f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{background:var(--g);color:white;padding:16px clamp(14px,4vw,55px);display:flex;gap:22px;align-items:center;flex-wrap:wrap}.brand{font-size:28px;font-weight:900}nav{display:flex;gap:18px;flex-wrap:wrap}nav a{color:white;text-decoration:none;font-weight:700}.wrap{max-width:700px;margin:35px auto;padding:0 16px}h1{font-size:clamp(32px,5vw,48px);margin:0 0 8px}.muted{color:var(--muted)}.card{border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:22px}label{display:block;font-weight:700;margin:14px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #c9cfcc;border-radius:8px;font:inherit}button{background:var(--g);color:white;border:0;border-radius:9px;padding:12px 16px;font:inherit;font-weight:750;margin-top:16px}#msg{display:none;background:var(--soft);padding:12px;border-radius:8px;margin-top:12px}
</style></head><body><header><div class="brand">occl <span style="font-size:12px;font-weight:600">One Click Challenge List</span></div><nav><a href="index.html">List</a><a href="records.html">Records</a><a href="submit-record.html">Submit Record</a><a href="submit-level.html">Submit Level</a></nav></header><main class="wrap"><h1>Submit a Record</h1><p class="muted">Send your completion details for SpikeGmd to review.</p><div class="card"><form id="f"><label for="player">Geometry Dash username</label><input id="player" required maxlength="40" placeholder="Your username"><label for="level">Challenge</label><select id="level"><option>#1 — Wowzers</option><option>#2 — Giga Chad</option><option>#3 — Framy</option><option>#4 — Free OCCL Points</option><option>#5 — Huh</option></select><label for="percent">Completion percentage</label><input id="percent" type="number" min="1" max="100" value="100" required><label for="proof">Proof video URL</label><input id="proof" type="url" required placeholder="https://youtu.be/..."><label for="notes">Extra notes (optional)</label><textarea id="notes" rows="3" maxlength="500" placeholder="Any details for the reviewer"></textarea><button type="submit">Prepare record submission</button><div id="msg">This is a preview form only: nothing has been sent or saved. To accept real submissions, the site needs a connected backend/database.</div></form></div></main><script>document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();document.getElementById('msg').style.display='block'});</script></body></html>
