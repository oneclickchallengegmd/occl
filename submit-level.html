<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OCCL — Submit a Level</title><style>
:root{--g:#2e9f80;--bg:#fff;--text:#151515;--muted:#686868;--line:#e4e7e6;--soft:#f3f7f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{background:var(--g);color:white;padding:16px clamp(14px,4vw,55px);display:flex;gap:22px;align-items:center;flex-wrap:wrap}.brand{font-size:28px;font-weight:900}nav{display:flex;gap:18px;flex-wrap:wrap}nav a{color:white;text-decoration:none;font-weight:700}.wrap{max-width:700px;margin:35px auto;padding:0 16px}h1{font-size:clamp(32px,5vw,48px);margin:0 0 8px}.muted{color:var(--muted)}.card{border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:22px}label{display:block;font-weight:700;margin:14px 0 5px}input,textarea{width:100%;padding:12px;border:1px solid #c9cfcc;border-radius:8px;font:inherit}button{background:var(--g);color:white;border:0;border-radius:9px;padding:12px 16px;font:inherit;font-weight:750;margin-top:16px}#msg{display:none;background:var(--soft);padding:12px;border-radius:8px;margin-top:12px}
</style></head><body><header><div class="brand">occl <span style="font-size:12px;font-weight:600">One Click Challenge List</span></div><nav><a href="index.html">List</a><a href="records.html">Records</a><a href="submit-record.html">Submit Record</a><a href="submit-level.html">Submit Level</a></nav></header><main class="wrap"><h1>Submit a Level</h1><p class="muted">Suggest a One Click Challenge for the OCCL. The creator can review it before adding it to the list.</p><div class="card"><form id="f"><label for="name">Level name</label><input id="name" required maxlength="100" placeholder="Challenge name"><label for="id">Geometry Dash level ID</label><input id="id" required inputmode="numeric" pattern="[0-9]+" placeholder="Level ID"><label for="creator">Level creator (if known)</label><input id="creator" maxlength="80" placeholder="Creator username"><label for="video">Level or showcase video URL</label><input id="video" type="url" placeholder="https://youtu.be/..."><label for="reason">Why should it be added?</label><textarea id="reason" rows="3" maxlength="500" placeholder="Short explanation"></textarea><button type="submit">Prepare level submission</button><div id="msg">This is a preview form only: nothing has been sent or saved. A backend/database is needed to receive suggestions.</div></form></div></main><script>document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();document.getElementById('msg').style.display='block'});</script></body></html>
