<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suggest level — OCCL</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html">OCCL</a><nav><a href="index.html">Challenges</a><a href="records.html">Records</a><a href="submit-record.html">Submit record</a><a href="submit-level.html">Suggest level</a><a href="editors.html">Creator panel</a></nav></header><main class="wrap"><h1>Suggest a level</h1><p class="muted">Suggestions are reviewed before publication.</p><form id="form" class="fields"><div class="field"><label>Level name</label><input id="name" required></div><div class="field"><label>Geometry Dash level ID</label><input id="levelid" required></div><div class="field full"><label>Showcase URL</label><input id="video" type="url" required></div><div class="field"><label>Your name (optional)</label><input id="submitter"></div><div class="field"><label>Difficulty (optional)</label><input id="difficulty"></div><div class="field full"><label>Notes (optional)</label><textarea id="notes"></textarea></div><div class="field full"><button class="btn">Send suggestion</button><p id="msg" class="muted small"></p></div></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase.js"></script><script>document.querySelector("#form").onsubmit=async e=>{e.preventDefault();let m=document.querySelector("#msg");try{if(!occlClient)throw Error("Configure supabase-config.js first.");let {error}=await occlClient.from("level_submissions").insert({level_name:name.value.trim(),level_id:levelid.value.trim(),video_url:video.value.trim(),submitter_name:submitter.value.trim()||null,difficulty:difficulty.value.trim()||null,notes:notes.value.trim()||null,status:"pending"});if(error)throw error;e.target.reset();m.textContent="Suggestion sent for review!";}catch(x){m.textContent="Submission failed: "+x.message;}}</script></body></html>
