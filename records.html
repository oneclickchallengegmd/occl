<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Records — OCCL</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html">OCCL</a><nav><a href="index.html">Challenges</a><a href="records.html">Records</a><a href="submit-record.html">Submit record</a><a href="submit-level.html">Suggest level</a><a href="editors.html">Creator panel</a></nav></header><main class="wrap"><h1>Verified records</h1><p class="muted">Only records approved by SpikeGmd appear here.</p><section id="records" class="grid"><div class="empty">Loading…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase.js"></script><script>function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))} (async()=>{let el=document.querySelector("#records");try{if(!occlClient)throw Error("Database connection not configured.");let {data,error}=await occlClient.from("record_submissions").select("player_name,level_name,progress,video_url,created_at").eq("status","approved").order("created_at",{ascending:false});if(error)throw error;el.innerHTML=data.length?data.map(r=>`<article class="card"><span class="pill">${esc(r.level_name)}</span><h3>${esc(r.player_name)} — ${Number(r.progress)}%</h3><a href="${esc(r.video_url)}" target="_blank" rel="noopener">Watch proof ↗</a></article>`).join(""):'<div class="empty">No approved records yet.</div>'}catch(e){el.innerHTML='<div class="empty">Could not load records: '+esc(e.message)+'</div>'}})()</script></body></html>
